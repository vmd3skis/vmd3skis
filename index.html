<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#101f3a" />
  <title>Toveli — Restaurant Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="#overview" class="brand" aria-label="Toveli overview"><img class="brand-logo" src="assets/toveli-logo.svg" alt="Toveli" width="150" height="50" /></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="#overview" class="nav-link active" data-route="overview"><span data-icon="house"></span>Overview</a>
        <a href="#menu" class="nav-link" data-route="menu"><span data-icon="book"></span>Menu</a>
        <a href="#specials" class="nav-link" data-route="specials"><span data-icon="star"></span>Specials</a>
        <a href="#analytics" class="nav-link" data-route="analytics"><span data-icon="bars"></span>Analytics</a>
      </nav>
      <div class="sidebar-decoration" aria-hidden="true"><span class="deco-orb"></span><svg viewBox="0 0 240 220"><path d="M-20 204C38 128 80 218 127 112S216 137 260 23" fill="none" stroke="#D6A574" stroke-width="1.5"/><circle cx="127" cy="112" r="11" fill="#ECC9A4"/></svg></div>
      <button id="restaurant-switch" class="restaurant-switch" type="button" title="Assigned restaurant: Monroe's"><img src="assets/restaurant.png" alt="Monroe’s dining room"/><span><strong>Monroe's</strong><small>Assigned restaurant</small></span><span data-icon="chevron-right"></span></button>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="mobile-menu" aria-label="Toggle navigation"><span data-icon="menu"></span></button>
        <label class="global-search"><span data-icon="search"></span><input id="global-search" autocomplete="off" placeholder="Search menu items, categories, or specials..." aria-label="Search menu items, categories, or specials" /></label>
        <div class="header-actions">
          <button class="pill-button live-button" id="live-menu"><span data-icon="external-link"></span>View live menu</button>
          <button class="notify-button" id="notify-btn" aria-label="Notifications"><span data-icon="bell"></span><i></i></button>
          <button class="account-button" id="account-btn" aria-expanded="false"><span class="avatar">M</span><span class="account-label"><strong>Monroe's</strong><small>Restaurant Owner</small></span><span data-icon="chevron-down"></span></button>
          <div class="account-dropdown" id="account-dropdown" hidden><span class="account-email">manager@monroes.com</span><button id="change-password">Change password</button><button id="sign-out">Sign out</button></div>
        </div>
      </header>
      <main class="content" id="app-content" tabindex="-1"></main>
      <footer class="demo-footer">Toveli restaurant admin · Demonstration interface with locally saved sample data</footer>
    </div>
  </div>
  <div class="toast-area" id="toast-area" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-container"></section></div>
</body>
</html>
